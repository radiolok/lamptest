<text x="640" y="650" font-size="13" font-weight="400" text-anchor="start" fill="#6b7280" >Arrows point from the writer to the reader;</text>
<text x="640" y="669" font-size="13" font-weight="400" text-anchor="start" fill="#6b7280" >the colour shows which context does it.</text>
